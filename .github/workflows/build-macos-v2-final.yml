name: Build macOS V2 FINAL Beta

on:
  push:
    branches:
      - v2-rebuild-from-final
    paths:
      - ".github/workflows/build-macos-v2-final.yml"
      - "source/processor.cpp"

jobs:
  build-macos-universal:
    runs-on: macos-15
    steps:
      - name: Checkout V2 final branch
        uses: actions/checkout@v4

      - name: Checkout Steinberg VST3 SDK
        uses: actions/checkout@v4
        with:
          repository: steinbergmedia/vst3sdk
          ref: 3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96
          path: vst3sdk
          submodules: recursive

      - name: Configure Universal macOS
        run: >
          cmake -S . -B build -G Xcode
          -DVST3_SDK_ROOT="$GITHUB_WORKSPACE/vst3sdk"
          -DSMTG_CREATE_PLUGIN_LINK=0
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15

      - name: Build MixEngine V2 variants
        run: cmake --build build --config Release --target 125A-MixEngine 125A-MixEngine-Channel

      - name: Verify Universal binaries
        shell: bash
        run: |
          set -euo pipefail
          for bundle in "125A-MixEngine.vst3" "125A-MixEngine-Channel.vst3"; do
            path="$(find build -type d -name "$bundle" | head -n 1)"
            test -n "$path"
            bin="$(find "$path/Contents/MacOS" -type f | head -n 1)"
            echo "===== $bundle ====="
            file "$bin"
            lipo -archs "$bin"
            lipo -archs "$bin" | grep -q "arm64"
            lipo -archs "$bin" | grep -q "x86_64"
          done

      - name: Package macOS Universal Beta
        shell: bash
        run: |
          set -euo pipefail
          ROOT="dist/125A-MixEngine-V2-v2.0.0-macOS-BETA-Universal"
          ZIP="dist/125A-MixEngine-V2-v2.0.0-macOS-BETA-Universal-Full-Package.zip"
          rm -rf dist
          mkdir -p "$ROOT/VST3" "$ROOT/Documentation"

          MIXFX="$(find build -type d -name '125A-MixEngine.vst3' | head -n 1)"
          CHANNEL="$(find build -type d -name '125A-MixEngine-Channel.vst3' | head -n 1)"
          test -n "$MIXFX"
          test -n "$CHANNEL"

          ditto "$MIXFX" "$ROOT/VST3/125A-MixEngine.vst3"
          ditto "$CHANNEL" "$ROOT/VST3/125A-MixEngine-Channel.vst3"

          cp docs/125A_MixEngine_Bedienungsanleitung_DE.pdf "$ROOT/Documentation/"
          cp docs/125A_MixEngine_User_Manual_EN.pdf "$ROOT/Documentation/"
          cp README.md "$ROOT/"
          cp RELEASE_NOTES.md "$ROOT/"
          cp LICENSE.txt "$ROOT/"

          printf '%s\n' \
            '125A MixEngine V2 v2.0.0 - macOS Universal VST3 BETA' \
            '' \
            'IMPORTANT' \
            'This macOS build is a beta because it has not yet been tested by 125A Systems on physical Mac hardware.' \
            'The contained VST3 binaries are Universal (Apple Silicon arm64 + Intel x86_64).' \
            '' \
            'INSTALLATION' \
            '1. Close the DAW.' \
            '2. Copy the desired .vst3 bundle from the VST3 folder to:' \
            '   ~/Library/Audio/Plug-Ins/VST3/' \
            '   or' \
            '   /Library/Audio/Plug-Ins/VST3/' \
            '3. Start the DAW and rescan VST3 plug-ins if required.' \
            '' \
            '125A-MixEngine.vst3' \
            '- PreSonus Studio One Mix FX edition.' \
            '- Intended for the Studio One Mix FX slot.' \
            '' \
            '125A-MixEngine-Channel.vst3' \
            '- Standard VST3 insert edition.' \
            '- Intended for tracks, buses and normal VST3 hosts.' \
            '' \
            'Both editions may be installed side by side.' \
            '' \
            'If macOS blocks an unsigned/not-notarized beta build, remove quarantine from the copied bundle in Terminal:' \
            'xattr -dr com.apple.quarantine "/path/to/125A-MixEngine.vst3"' \
            'or' \
            'xattr -dr com.apple.quarantine "/path/to/125A-MixEngine-Channel.vst3"' \
            '' \
            'Please report the macOS version, Mac model/CPU, DAW/version and exact reproduction steps for any problem.' \
            > "$ROOT/INSTALL_MACOS_BETA.txt"

          (
            cd "$ROOT"
            find . -type f ! -name CHECKSUMS_SHA256.txt -print0 |
              sort -z |
              xargs -0 shasum -a 256 > CHECKSUMS_SHA256.txt
          )

          ditto -c -k --sequesterRsrc --keepParent "$ROOT" "$ZIP"
          echo "Created $ZIP"
          ls -lh "$ZIP"

      - name: Upload macOS Universal Beta package
        uses: actions/upload-artifact@v4
        with:
          name: 125A-MixEngine-V2-v2.0.0-macOS-BETA-Universal-Full-Package
          path: dist/125A-MixEngine-V2-v2.0.0-macOS-BETA-Universal-Full-Package.zip
          if-no-files-found: error
