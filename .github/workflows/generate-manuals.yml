name: Generate PDF Manuals

on:
  push:
    branches: [main]
    paths:
      - ".github/manuals-generate-trigger"

permissions:
  contents: write

jobs:
  manuals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ReportLab
        run: python -m pip install --disable-pip-version-check reportlab
      - name: Generate manuals
        run: python scripts/render_manuals.py
      - name: Commit generated PDFs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/125A_MixEngine_Bedienungsanleitung_DE.pdf docs/125A_MixEngine_User_Manual_EN.pdf
          if git diff --cached --quiet; then
            echo "PDF manuals already up to date"
          else
            git commit -m "Generate final DE and EN PDF manuals"
            git push
          fi
