name: FINAL V2 Gumroad Package

on:
  push:
    branches: [v2-rebuild-from-final]

jobs:
  release:
    if: github.event.head_commit.message == 'Build FINAL V2 Gumroad package'
    runs-on: windows-2022
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Verify static contracts
        shell: pwsh
        run: |
          python scripts/verify_gui_layout.py
          python scripts/verify_parameter_contract.py
          python scripts/verify_channel_contract.py

      - name: Checkout Steinberg VST3 SDK
        uses: actions/checkout@v4
        with:
          repository: steinbergmedia/vst3sdk
          ref: 3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96
          path: vst3sdk
          submodules: recursive

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DVST3_SDK_ROOT="$env:GITHUB_WORKSPACE/vst3sdk" -DSMTG_CREATE_PLUGIN_LINK=0

      - name: Build release and critical diagnostics
        run: >
          cmake --build build --config Release --target
          125A-MixEngine
          125A-MixEngine-Channel
          denormal-safety-diagnostic
          zero-neutrality-diagnostic
          sample-accuracy-diagnostic
          mixfx-sample-accuracy-diagnostic
          sample-rate-matrix-diagnostic
          sonic-impact-diagnostic
          validator

      - name: Run critical V2 diagnostics
        shell: pwsh
        run: |
          $tests=@(
            "denormal-safety-diagnostic",
            "zero-neutrality-diagnostic",
            "sample-accuracy-diagnostic",
            "mixfx-sample-accuracy-diagnostic",
            "sample-rate-matrix-diagnostic",
            "sonic-impact-diagnostic"
          )
          foreach($name in $tests){
            $exe=Get-ChildItem build -Recurse -File -Filter "$name.exe"|Select-Object -First 1
            if(-not $exe){throw "$name.exe not found"}
            Write-Host "===== $name ====="
            & $exe.FullName
            if($LASTEXITCODE -ne 0){throw "$name failed with exit $LASTEXITCODE"}
          }

      - name: Validate Channel VST3
        shell: pwsh
        run: |
          $validator=Get-ChildItem build -Recurse -File -Filter "validator.exe"|Select-Object -First 1
          $plugin=Get-ChildItem build -Recurse -Directory -Filter "125A-MixEngine-Channel.vst3"|Select-Object -First 1
          if(-not $validator){throw "validator.exe not found"}
          if(-not $plugin){throw "125A-MixEngine-Channel.vst3 not found"}
          & $validator.FullName $plugin.FullName
          if($LASTEXITCODE -ne 0){throw "Steinberg validator failed with exit $LASTEXITCODE"}

      - name: Build V2 manuals
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --quiet reportlab==4.4.9
          python scripts/build_manuals_v2.py dist/manuals
          if(-not (Test-Path "dist/manuals/125A_MixEngine_V2_Bedienungsanleitung_DE.pdf")){throw "German V2 PDF missing"}
          if(-not (Test-Path "dist/manuals/125A_MixEngine_V2_User_Manual_EN.pdf")){throw "English V2 PDF missing"}

      - name: Create Gumroad package
        shell: pwsh
        run: |
          $root="dist/125A-MixEngine-V2-v2.0.0-Windows-x64-Gumroad"
          New-Item -ItemType Directory -Force -Path "$root/VST3" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root/Documentation" | Out-Null

          $mix=Get-ChildItem build -Recurse -Directory -Filter "125A-MixEngine.vst3"|Select-Object -First 1
          $ch=Get-ChildItem build -Recurse -Directory -Filter "125A-MixEngine-Channel.vst3"|Select-Object -First 1
          if(-not $mix){throw "125A-MixEngine.vst3 not found"}
          if(-not $ch){throw "125A-MixEngine-Channel.vst3 not found"}

          Copy-Item $mix.FullName "$root/VST3/125A-MixEngine-V2.vst3" -Recurse
          Copy-Item $ch.FullName "$root/VST3/125A-MixEngine-V2-Channel.vst3" -Recurse
          Copy-Item "dist/manuals/125A_MixEngine_V2_Bedienungsanleitung_DE.pdf" "$root/Documentation/"
          Copy-Item "dist/manuals/125A_MixEngine_V2_User_Manual_EN.pdf" "$root/Documentation/"
          Copy-Item "README.md" "$root/"
          Copy-Item "RELEASE_NOTES.md" "$root/"
          Copy-Item "LICENSE.txt" "$root/"

          @"
          125A MixEngine V2 - v2.0.0 - Windows x64

          INSTALLATION
          1. Close your DAW.
          2. Copy the desired .vst3 bundle from VST3 to:
             C:\Program Files\Common Files\VST3
          3. Start the DAW and rescan VST3 plugins if required.

          125A-MixEngine-V2.vst3
          - PreSonus Studio One Mix FX edition.

          125A-MixEngine-V2-Channel.vst3
          - Standard VST3 insert edition.

          The plugin GUI and host-facing plugin name identify this build as V2.
          Complete German and English manuals are in Documentation.
          "@ | Set-Content "$root/INSTALL.txt" -Encoding UTF8

          $zip="dist/125A-MixEngine-V2-v2.0.0-Windows-x64-Gumroad.zip"
          if(Test-Path $zip){Remove-Item $zip -Force}
          Compress-Archive -Path "$root/*" -DestinationPath $zip -CompressionLevel Optimal
          if(-not (Test-Path $zip)){throw "Gumroad ZIP not created"}

      - name: Upload Gumroad package
        uses: actions/upload-artifact@v4
        with:
          name: 125A-MixEngine-V2-v2.0.0-Windows-x64-Gumroad
          path: dist/125A-MixEngine-V2-v2.0.0-Windows-x64-Gumroad.zip
          if-no-files-found: error
