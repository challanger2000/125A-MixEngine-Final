name: FINAL V2 Targeted Retest

on:
  push:
    branches: [v2-rebuild-from-final]

jobs:
  targeted:
    if: github.event.head_commit.message == 'Run FINAL V2 targeted retest'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Verify static contracts
        shell: pwsh
        run: |
          python scripts/verify_parameter_contract.py
          python scripts/verify_channel_contract.py
      - uses: actions/checkout@v4
        with:
          repository: steinbergmedia/vst3sdk
          ref: 3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96
          path: vst3sdk
          submodules: recursive
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DVST3_SDK_ROOT="$env:GITHUB_WORKSPACE/vst3sdk" -DSMTG_CREATE_PLUGIN_LINK=0
      - name: Build touched targets
        run: >
          cmake --build build --config Release --target
          125A-MixEngine
          125A-MixEngine-Channel
          character-morph-diagnostic
          media-oversampling
          range-philosophy-diagnostic
          tape-memory-diagnostic
          sonic-impact-diagnostic
          sample-rate-matrix-diagnostic
      - name: Run touched diagnostics
        shell: pwsh
        run: |
          $tests=@(
            "character-morph-diagnostic",
            "media-oversampling",
            "range-philosophy-diagnostic",
            "tape-memory-diagnostic",
            "sonic-impact-diagnostic",
            "sample-rate-matrix-diagnostic"
          )
          foreach($name in $tests){
            $exe=Get-ChildItem build -Recurse -File -Filter "$name.exe"|Select-Object -First 1
            if(-not $exe){throw "$name.exe not found"}
            Write-Host "===== $name ====="
            & $exe.FullName
            if($LASTEXITCODE -ne 0){throw "$name failed with exit $LASTEXITCODE"}
          }
