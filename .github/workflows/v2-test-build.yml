name: FINAL V2 Test Build

on:
  push:
    branches: [v2-rebuild-from-final]

jobs:
  build:
    if: github.event.head_commit.message == 'Build FINAL V2 test package'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: steinbergmedia/vst3sdk
          ref: 3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96
          path: vst3sdk
          submodules: recursive
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DVST3_SDK_ROOT="$env:GITHUB_WORKSPACE/vst3sdk" -DSMTG_CREATE_PLUGIN_LINK=0
      - name: Build plugins
        run: cmake --build build --config Release --target 125A-MixEngine 125A-MixEngine-Channel
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          $mix = Get-ChildItem build -Recurse -Directory -Filter "125A-MixEngine.vst3" | Select-Object -First 1
          $ch  = Get-ChildItem build -Recurse -Directory -Filter "125A-MixEngine-Channel.vst3" | Select-Object -First 1
          if(-not $mix){ throw "125A-MixEngine.vst3 not found" }
          if(-not $ch){ throw "125A-MixEngine-Channel.vst3 not found" }
          Copy-Item $mix.FullName "package\\125A-MixEngine-V2.vst3" -Recurse
          Copy-Item $ch.FullName "package\\125A-MixEngine-V2-Channel.vst3" -Recurse
          Compress-Archive -Path package\* -DestinationPath "125A-MixEngine-V2-Test-Windows-x64.zip"
      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: 125A-MixEngine-V2-Test-Windows-x64
          path: 125A-MixEngine-V2-Test-Windows-x64.zip
          if-no-files-found: error
