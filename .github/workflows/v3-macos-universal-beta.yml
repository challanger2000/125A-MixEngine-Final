name: macOS V3 Universal Beta

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout approved MixEngine GUI assets
        uses: actions/checkout@v4
        with:
          repository: challanger2000/125A-Knob-Designer
          ref: c09cff5d958969eb025fe09255173e65103deae9
          path: knob-assets
          fetch-depth: 1

      - name: Verify static contracts
        run: |
          python3 scripts/check_gui_layout.py resource/mixengine.uidesc resource/mixengine_channel.uidesc
          python3 scripts/verify_parameter_contract.py
          python3 scripts/verify_channel_contract.py

      - name: Prepare GUI assets
        run: |
          python3 -m pip install --disable-pip-version-check --quiet pillow
          python3 scripts/prepare_gui_assets.py "$GITHUB_WORKSPACE/knob-assets/assets/mixengine"

      - name: Checkout Steinberg VST3 SDK
        uses: actions/checkout@v4
        with:
          repository: steinbergmedia/vst3sdk
          ref: 3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96
          path: vst3sdk
          submodules: recursive

      - name: Configure Universal Binary
        run: |
          cmake -S . -B build -G Xcode \
            -DVST3_SDK_ROOT="$GITHUB_WORKSPACE/vst3sdk" \
            -DMIXENGINE_KNOB_ASSET_ROOT="$GITHUB_WORKSPACE/knob-assets/assets/mixengine" \
            -DSMTG_CREATE_PLUGIN_LINK=0 \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build plugins, validator and release gates
        run: |
          cmake --build build --config Release --target \
            125A-MixEngine-V3 \
            125A-MixEngine-V3-Channel \
            validator \
            release-robustness-diagnostic \
            state-roundtrip-diagnostic \
            state-migration-diagnostic \
            latency-matrix-diagnostic \
            metering-integration \
            zero-neutrality-diagnostic \
            sample-accuracy-diagnostic \
            mixfx-sample-accuracy-diagnostic \
            sample-rate-matrix-diagnostic \
            denormal-safety-diagnostic \
            phase-mono-diagnostic \
            level-match-diagnostic \
            console-noise-contract-diagnostic \
            mixfx-crosstalk-diagnostic \
            quality-switch-diagnostic \
            automation-stress-diagnostic \
            controller-lifecycle-diagnostic \
            tube-v3-autolevel-diagnostic \
            tape-v3-autolevel-diagnostic \
            vinyl-v3-autolevel-diagnostic \
            vinyl-v3-live-diagnostic \
            vinyl-v3-cpu-diagnostic \
            console-v3-cpu-diagnostic \
            v3-autolevel-level-sweep

      - name: Run release gates
        run: |
          set -euo pipefail
          tests=(
            release-robustness-diagnostic
            state-roundtrip-diagnostic
            state-migration-diagnostic
            latency-matrix-diagnostic
            metering-integration
            zero-neutrality-diagnostic
            sample-accuracy-diagnostic
            mixfx-sample-accuracy-diagnostic
            sample-rate-matrix-diagnostic
            denormal-safety-diagnostic
            phase-mono-diagnostic
            level-match-diagnostic
            console-noise-contract-diagnostic
            mixfx-crosstalk-diagnostic
            quality-switch-diagnostic
            automation-stress-diagnostic
            controller-lifecycle-diagnostic
            tube-v3-autolevel-diagnostic
            tape-v3-autolevel-diagnostic
            vinyl-v3-autolevel-diagnostic
            vinyl-v3-live-diagnostic
            vinyl-v3-cpu-diagnostic
            console-v3-cpu-diagnostic
            v3-autolevel-level-sweep
          )
          for name in "${tests[@]}"; do
            exe="$(find build -type f -name "$name" -perm -111 | head -n 1)"
            if [ -z "$exe" ]; then
              echo "::error::$name executable not found"
              exit 1
            fi
            echo "===== $name ====="
            "$exe"
          done

      - name: Locate VST3 bundles
        id: locate
        run: |
          set -euo pipefail
          MIX="$(find build -type d -name '125A-MixEngine-V3.vst3' | head -n 1)"
          CH="$(find build -type d -name '125A-MixEngine-V3-Channel.vst3' | head -n 1)"
          VAL="$(find build -type f -name validator -perm -111 | head -n 1)"
          test -n "$MIX"
          test -n "$CH"
          test -n "$VAL"
          echo "mix=$MIX" >> "$GITHUB_OUTPUT"
          echo "channel=$CH" >> "$GITHUB_OUTPUT"
          echo "validator=$VAL" >> "$GITHUB_OUTPUT"

      - name: Verify Universal slices
        run: |
          set -euo pipefail
          for bundle in "${{ steps.locate.outputs.mix }}" "${{ steps.locate.outputs.channel }}"; do
            binary="$(find "$bundle/Contents/MacOS" -type f -maxdepth 1 | head -n 1)"
            archs="$(lipo -archs "$binary")"
            echo "$bundle -> $archs"
            echo "$archs" | grep -q arm64
            echo "$archs" | grep -q x86_64
          done

      - name: Validate Channel VST3
        run: |
          "${{ steps.locate.outputs.validator }}" "${{ steps.locate.outputs.channel }}"

      - name: Ad-hoc sign tester bundles
        run: |
          codesign --force --deep --sign - "${{ steps.locate.outputs.mix }}"
          codesign --force --deep --sign - "${{ steps.locate.outputs.channel }}"
          codesign --verify --deep --strict --verbose=2 "${{ steps.locate.outputs.mix }}"
          codesign --verify --deep --strict --verbose=2 "${{ steps.locate.outputs.channel }}"

      - name: Build manuals
        run: |
          python3 -m pip install --disable-pip-version-check --quiet reportlab==4.4.9
          python3 scripts/render_manuals.py
          test -f docs/125A_MixEngine_Bedienungsanleitung_DE.pdf
          test -f docs/125A_MixEngine_User_Manual_EN.pdf

      - name: Create macOS beta tester package
        run: |
          set -euo pipefail
          ROOT="dist/125A-MixEngine-V3-v3.0.0-macOS-Universal-BETA"
          ZIP="dist/125A-MixEngine-V3-v3.0.0-macOS-Universal-BETA.zip"
          rm -rf dist
          mkdir -p "$ROOT/VST3" "$ROOT/Documentation"

          cp -R "${{ steps.locate.outputs.mix }}" "$ROOT/VST3/125A-MixEngine-V3.vst3"
          cp -R "${{ steps.locate.outputs.channel }}" "$ROOT/VST3/125A-MixEngine-V3-Channel.vst3"
          cp docs/125A_MixEngine_Bedienungsanleitung_DE.pdf "$ROOT/Documentation/"
          cp docs/125A_MixEngine_User_Manual_EN.pdf "$ROOT/Documentation/"
          cp README.md RELEASE_NOTES.md LICENSE.txt "$ROOT/"

          cat > "$ROOT/INSTALL.txt" <<'EOF'
          125A MixEngine V3 - v3.0.0 - macOS Universal (Intel + Apple Silicon) - BETA

          TEST STATUS
          This macOS build is BETA/UNTESTED until validated on real Mac hardware.

          INSTALLATION
          1. Close Studio One.
          2. Copy the desired .vst3 bundle into:
             ~/Library/Audio/Plug-Ins/VST3
             or
             /Library/Audio/Plug-Ins/VST3
          3. Start Studio One and rescan plugins if required.

          125A-MixEngine-V3.vst3
          - PreSonus Studio One Mix FX edition.
          - Provides adjacent-channel Crosstalk in the Mix FX environment.

          125A-MixEngine-V3-Channel.vst3
          - Standard VST3 insert edition.

          NOTE
          These tester builds are ad-hoc signed, not Apple Developer ID notarized.
          If macOS quarantine blocks the plugin after download, remove quarantine
          from the copied VST3 bundle before testing.
          EOF

          (
            cd "$ROOT"
            find . -type f -print0 | sort -z | xargs -0 shasum -a 256
          ) > "$ROOT/CHECKSUMS_SHA256.txt"

          ditto -c -k --sequesterRsrc --keepParent "$ROOT" "$ZIP"
          test -f "$ZIP"

      - name: Upload macOS beta tester package
        uses: actions/upload-artifact@v4
        with:
          name: 125A-MixEngine-V3-v3.0.0-macOS-Universal-BETA
          path: dist/125A-MixEngine-V3-v3.0.0-macOS-Universal-BETA.zip
          if-no-files-found: error
