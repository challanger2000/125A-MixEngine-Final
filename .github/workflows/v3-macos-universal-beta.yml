name: macOS V3 Universal Beta

on:
  workflow_dispatch:

jobs:
  build-macos-universal:
    runs-on: macos-15
    steps:
      - name: Checkout V3 beta branch
        uses: actions/checkout@v4

      - name: Checkout approved MixEngine GUI assets
        uses: actions/checkout@v4
        with:
          repository: challanger2000/125A-Knob-Designer
          ref: c09cff5d958969eb025fe09255173e65103deae9
          path: knob-assets
          fetch-depth: 1

      - name: Verify static contracts
        run: |
          python3 scripts/check_gui_layout.py resource/mixengine.uidesc resource/mixengine_channel.uidesc
          python3 scripts/verify_parameter_contract.py
          python3 scripts/verify_channel_contract.py

      - name: Prepare V3 GUI assets
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --disable-pip-version-check --quiet pillow
          python scripts/prepare_gui_assets.py "$GITHUB_WORKSPACE/knob-assets/assets/mixengine"

      - name: Checkout Steinberg VST3 SDK
        uses: actions/checkout@v4
        with:
          repository: steinbergmedia/vst3sdk
          ref: 3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96
          path: vst3sdk
          submodules: recursive

      - name: Configure Universal macOS
        run: >
          cmake -S . -B build -G Xcode
          -DVST3_SDK_ROOT="$GITHUB_WORKSPACE/vst3sdk"
          -DMIXENGINE_KNOB_ASSET_ROOT="$GITHUB_WORKSPACE/knob-assets/assets/mixengine"
          -DSMTG_CREATE_PLUGIN_LINK=0
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build MixEngine V3 variants and validator
        run: cmake --build build --config Release --target 125A-MixEngine-V3 125A-MixEngine-V3-Channel validator

      - name: Locate bundles and validator
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          MIXFX="$(find build -type d -name '125A-MixEngine-V3.vst3' | head -n 1)"
          CHANNEL="$(find build -type d -name '125A-MixEngine-V3-Channel.vst3' | head -n 1)"
          VALIDATOR="$(find build -type f -name validator -perm -111 | head -n 1)"
          test -n "$MIXFX"
          test -n "$CHANNEL"
          test -n "$VALIDATOR"
          echo "mixfx=$MIXFX" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "validator=$VALIDATOR" >> "$GITHUB_OUTPUT"

      - name: Verify Universal binaries
        shell: bash
        run: |
          set -euo pipefail
          for bundle in "${{ steps.locate.outputs.mixfx }}" "${{ steps.locate.outputs.channel }}"; do
            bin="$(find "$bundle/Contents/MacOS" -type f | head -n 1)"
            echo "===== $bundle ====="
            file "$bin"
            archs="$(lipo -archs "$bin")"
            echo "$archs"
            echo "$archs" | grep -q arm64
            echo "$archs" | grep -q x86_64
          done

      - name: Validate Channel VST3
        shell: bash
        run: |
          set -euo pipefail
          "${{ steps.locate.outputs.validator }}" "${{ steps.locate.outputs.channel }}"

      - name: Ad-hoc sign beta bundles
        shell: bash
        run: |
          set -euo pipefail
          codesign --force --deep --sign - "${{ steps.locate.outputs.mixfx }}"
          codesign --force --deep --sign - "${{ steps.locate.outputs.channel }}"
          codesign --verify --deep --strict --verbose=2 "${{ steps.locate.outputs.mixfx }}"
          codesign --verify --deep --strict --verbose=2 "${{ steps.locate.outputs.channel }}"

      - name: Package macOS Universal Beta
        shell: bash
        run: |
          set -euo pipefail
          ROOT="dist/125A-MixEngine-V3-v3.0.0-macOS-BETA-Universal"
          ZIP="dist/125A-MixEngine-V3-v3.0.0-macOS-BETA-Universal-Full-Package.zip"
          rm -rf dist
          mkdir -p "$ROOT/VST3" "$ROOT/Documentation"

          ditto "${{ steps.locate.outputs.mixfx }}" "$ROOT/VST3/125A-MixEngine-V3.vst3"
          ditto "${{ steps.locate.outputs.channel }}" "$ROOT/VST3/125A-MixEngine-V3-Channel.vst3"

          cp docs/125A_MixEngine_Bedienungsanleitung_DE.pdf "$ROOT/Documentation/"
          cp docs/125A_MixEngine_User_Manual_EN.pdf "$ROOT/Documentation/"
          cp README.md "$ROOT/"
          cp RELEASE_NOTES.md "$ROOT/"
          cp LICENSE.txt "$ROOT/"

          printf '%s\n' \
            '125A MixEngine V3 v3.0.0 - macOS Universal VST3 BETA' \
            '' \
            'IMPORTANT' \
            'This macOS build is a beta until validated on physical Mac hardware.' \
            'The contained VST3 binaries are Universal (Apple Silicon arm64 + Intel x86_64).' \
            '' \
            'INSTALLATION' \
            '1. Close Studio One.' \
            '2. Copy the desired .vst3 bundle from the VST3 folder to:' \
            '   ~/Library/Audio/Plug-Ins/VST3/' \
            '   or' \
            '   /Library/Audio/Plug-Ins/VST3/' \
            '3. Start Studio One and rescan VST3 plug-ins if required.' \
            '' \
            '125A-MixEngine-V3.vst3' \
            '- PreSonus Studio One Mix FX edition.' \
            '' \
            '125A-MixEngine-V3-Channel.vst3' \
            '- Standard VST3 insert edition.' \
            '' \
            'If macOS blocks this ad-hoc signed/not-notarized beta after download, remove quarantine from the copied bundle.' \
            > "$ROOT/INSTALL_MACOS_BETA.txt"

          (
            cd "$ROOT"
            find . -type f ! -name CHECKSUMS_SHA256.txt -print0 |
              sort -z |
              xargs -0 shasum -a 256 > CHECKSUMS_SHA256.txt
          )

          ditto -c -k --sequesterRsrc --keepParent "$ROOT" "$ZIP"
          test -f "$ZIP"
          ls -lh "$ZIP"

      - name: Upload macOS Universal Beta package
        uses: actions/upload-artifact@v4
        with:
          name: 125A-MixEngine-V3-v3.0.0-macOS-BETA-Universal-Full-Package
          path: dist/125A-MixEngine-V3-v3.0.0-macOS-BETA-Universal-Full-Package.zip
          if-no-files-found: error
