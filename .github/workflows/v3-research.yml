name: V3 Research Diagnostics

on:
  push:
    branches: [v3.0.0-development]

jobs:
  tape-v3:
    runs-on: windows-2022
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout Steinberg VST3 SDK
        uses: actions/checkout@v4
        with:
          repository: steinbergmedia/vst3sdk
          ref: 3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96
          path: vst3sdk
          submodules: recursive

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DVST3_SDK_ROOT="$env:GITHUB_WORKSPACE/vst3sdk" -DSMTG_CREATE_PLUGIN_LINK=0

      - name: Build tape V3 diagnostics
        shell: pwsh
        run: cmake --build build --config Release --target 125A-MixEngine 125A-MixEngine-Channel zero-neutrality-diagnostic quality-switch-diagnostic tape-memory-diagnostic sonic-impact-diagnostic sample-rate-matrix-diagnostic denormal-safety-diagnostic tape-v3-autolevel-diagnostic console-v3-research-diagnostic mixfx-console-v3-diagnostic console-v3-alias-diagnostic console-v3-adaa-diagnostic console-v3-adaa-production-gate console-v3-prepared-adaa-diagnostic console-v3-prepared-cpu-diagnostic console-v3-correction-adaa-diagnostic console-v3-residual-adaa-diagnostic console-v3-correction-adaa2-diagnostic console-v3-cpu-diagnostic mixfx-crosstalk-diagnostic mixfx-sample-accuracy-diagnostic tube-v3-research-diagnostic tube-v3-autolevel-diagnostic tape-v3-research-diagnostic tape-v3-ja-oracle-diagnostic tape-v3-sample-rate-diagnostic vinyl-v3-tracing-oracle-diagnostic

      - name: Run tape V3 diagnostics
        shell: pwsh
        run: |
          $exe=Get-ChildItem build -Recurse -File -Filter "tape-v3-research-diagnostic.exe"|Select-Object -First 1
          if(-not $exe){throw "tape-v3-research-diagnostic.exe not found"}
          & $exe.FullName
          if($LASTEXITCODE -ne 0){throw "V3 tape research diagnostic failed with exit $LASTEXITCODE"}

          $oracle=Get-ChildItem build -Recurse -File -Filter "tape-v3-ja-oracle-diagnostic.exe"|Select-Object -First 1
          if(-not $oracle){throw "tape-v3-ja-oracle-diagnostic.exe not found"}
          & $oracle.FullName
          if($LASTEXITCODE -ne 0){throw "V3 Jiles-Atherton oracle diagnostic failed with exit $LASTEXITCODE"}

          $matrix=Get-ChildItem build -Recurse -File -Filter "tape-v3-sample-rate-diagnostic.exe"|Select-Object -First 1
          if(-not $matrix){throw "tape-v3-sample-rate-diagnostic.exe not found"}
          & $matrix.FullName
          if($LASTEXITCODE -ne 0){throw "V3 tape sample-rate matrix failed with exit $LASTEXITCODE"}

          $legacy=@("zero-neutrality-diagnostic","quality-switch-diagnostic","tape-memory-diagnostic","sonic-impact-diagnostic","sample-rate-matrix-diagnostic","denormal-safety-diagnostic","tape-v3-autolevel-diagnostic","console-v3-research-diagnostic","mixfx-console-v3-diagnostic","console-v3-alias-diagnostic","console-v3-adaa-diagnostic","console-v3-adaa-production-gate","console-v3-prepared-adaa-diagnostic","console-v3-prepared-cpu-diagnostic","console-v3-correction-adaa-diagnostic","console-v3-residual-adaa-diagnostic","console-v3-cpu-diagnostic","mixfx-crosstalk-diagnostic","mixfx-sample-accuracy-diagnostic","tube-v3-research-diagnostic","tube-v3-autolevel-diagnostic","vinyl-v3-tracing-oracle-diagnostic")
          foreach($name in $legacy){
            $d=Get-ChildItem build -Recurse -File -Filter "$name.exe"|Select-Object -First 1
            if(-not $d){throw "$name.exe not found"}
            Write-Host "===== $name ====="
            & $d.FullName
            if($LASTEXITCODE -ne 0){throw "$name failed with exit $LASTEXITCODE"}
          }


      - name: Research-only rejected candidates
        shell: pwsh
        run: |
          $rejected=@("console-v3-correction-adaa2-diagnostic")
          foreach($name in $rejected){
            $d=Get-ChildItem build -Recurse -File -Filter "$name.exe"|Select-Object -First 1
            if(-not $d){throw "$name.exe not found"}
            Write-Host "===== $name (NON-GATING RESEARCH) ====="
            & $d.FullName
            Write-Host "Exit code $LASTEXITCODE is recorded but intentionally non-gating: candidate rejected for production."
          }
          $global:LASTEXITCODE=0
          exit 0
